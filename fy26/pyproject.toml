[project]
name = "northwestern-agentic-ai-fy26"
version = "0.1.0"
description = "Northwestern MS AI, FY26 cohort: agentic AI on Microsoft Foundry"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.23.0",
    "agent-framework-foundry>=1.15.0",
    "agent-framework-orchestrations>=1.3.2",
    "azure-identity>=1.26.0",
    "azure-monitor-opentelemetry>=1.8.11",
    "fastapi>=0.159.1",
    "mcp>=2.2,<3",
    "openai>=3.36.1",
    "pydantic-settings>=2.16.1",
    "tenacity>=9.1.4,<9.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]
