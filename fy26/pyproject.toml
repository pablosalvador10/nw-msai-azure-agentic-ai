[project]
name = "northwestern-agentic-ai-fy26"
version = "0.1.0"
description = "Agentic AI on Microsoft Foundry: the FY26 course service, harness and website"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.23.0",
    "agent-framework-foundry>=1.15.0",
    "agent-framework-orchestrations>=1.4.0",
    "azure-identity>=1.26.0",
    "azure-monitor-opentelemetry>=1.8.11",
    "fastapi>=0.162.0",
    "markdown-it-py>=4.2",
    "mcp>=2.2,<3",
    "openai>=3.37.0",
    "pydantic-settings>=2.16.1",
    "tenacity>=9.1.4,<9.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]

[tool.coverage.run]
source = ["app", "harness", "web"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# The floor only moves up: raise it when tests cover more.
fail_under = 88

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.ipynb"]
force-exclude = true  # pre-commit passes file names; keep the excludes above

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # likely bugs
    "C4",           # comprehensions
    "UP",           # modern syntax for Python 3.12
    "SIM",          # simpler code
    "RUF",          # Ruff's own checks
    "PTH",          # pathlib instead of os.path
    "RET",          # return statements
    "PIE",          # unnecessary code
    "PERF",         # performance pitfalls
    "PT",           # pytest style
    "N",            # naming
    "S",            # security (bandit)
    "BLE",          # bare except Exception
    "FURB",         # refurbished idioms
    "LOG", "G",     # logging
    "TID",          # tidy imports
    "A",            # shadowed builtins
]
ignore = [
    "E501",   # line length is handled by the formatter
    "N818",   # exception names: RunRejected reads better than RunRejectedError
    "PT018",  # composite assertions are clearer in these teaching tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # pytest uses assert
    "S102",  # tests execute the lecture's code samples
    "S105", "S106",  # fake credentials for the sign-in and API key tests
    "S603",  # tests run the course's own commands
]
# The course helpers and the website publisher run az, terraform and git on purpose.
"course.py" = ["S603", "S607"]
"web/publish.py" = ["S603", "S607"]
