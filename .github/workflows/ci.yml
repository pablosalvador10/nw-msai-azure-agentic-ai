name: CI

on:
  push:
    branches: [main, develop, fy26]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit (Ruff, hygiene, notebooks, Terraform fmt)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run every hook on every file
        env:
          SKIP: gitleaks  # staged-only in pre-commit; the secrets job scans the commits instead
        run: pipx run pre-commit run --all-files --show-diff-on-failure --color always

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan the commits in this push or pull request
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  python:
    name: Tests (${{ matrix.cohort }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cohort: [fy26]
    defaults:
      run:
        working-directory: ${{ matrix.cohort }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2  # setup-uv publishes immutable releases only, no major tag
        with:
          enable-cache: true
          cache-dependency-glob: "${{ matrix.cohort }}/uv.lock"

      - name: Install dependencies (from uv.lock)
        run: uv sync --locked

      - name: Run Ruff with the locked version (lint and format)
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format --check .

      - name: Run tests with coverage (offline, no Azure)
        run: uv run pytest --cov --cov-report=term-missing:skip-covered

      - name: Check notebooks (valid JSON, no outputs)
        run: uv run python scripts/check_notebooks.py

  terraform:
    name: Terraform (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [fy26/infra, fy26/web/infra]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate
